limit_req_zone $binary_remote_addr zone=siyuan_mcp_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=siyuan_mcp_register:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name siyuan-mcp.wenyuanxu.net;
    ssl_certificate /etc/letsencrypt/live/siyuan-mcp.wenyuanxu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siyuan-mcp.wenyuanxu.net/privkey.pem;
    client_max_body_size 4m;

    location = /login {
        limit_req zone=siyuan_mcp_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:16809;
        proxy_set_header Host $host;
        access_log off;
    }
    location = /register {
        limit_req zone=siyuan_mcp_register burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:16809;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:16809;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
